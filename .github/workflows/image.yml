name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  HA_ARCHITECTURES: '["amd64", "aarch64"]'

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/actual-curator
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The Home Assistant app image is the service image above plus the options shim (actual_curator/).
  # Published only for v* tags, with the home-assistant/builder actions: one image per arch, signed,
  # then one multi-arch manifest, ghcr.io/<owner>/actual-curator-ha. See docs/releasing.md for why the
  # tag is pushed before the version bump reaches main.
  ha-init:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: app version matches the tag
        run: |
          grep -qx 'version: "${{ steps.v.outputs.version }}"' actual_curator/config.yaml
      - id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.HA_ARCHITECTURES }}
          image-name: actual-curator-ha

  ha-build:
    needs: ha-init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # Cosign signing
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ha-init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: ./actual_curator
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.ha-init.outputs.version }}
            latest
          version: ${{ needs.ha-init.outputs.version }}
          build-args: |
            APP_IMAGE=ghcr.io/${{ github.repository_owner }}/actual-curator:${{ needs.ha-init.outputs.version }}
          cache-gha-scope: ha-${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          push: "true"
          skip-existing: ${{ needs.ha-init.outputs.version }}

  ha-manifest:
    needs: [ha-init, ha-build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Cosign signing
      packages: write
    steps:
      - uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ env.HA_ARCHITECTURES }}
          image-name: actual-curator-ha
          image-tags: |
            ${{ needs.ha-init.outputs.version }}
            latest
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          skip-existing: ${{ needs.ha-init.outputs.version }}
